name: creator-intel-personal

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./data/reviews:/app/data/reviews
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
