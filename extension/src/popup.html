<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; color: #17181b; background: #fff; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #eceef1; }
    .mark { width: 42px; height: 42px; display: grid; place-items: center; flex: 0 0 auto; }
    .mark img { width: 42px; height: 42px; object-fit: contain; }
    .title { min-width: 0; }
    .title b { display: block; font-size: 14px; }
    .title span { display: block; color: #747982; font-size: 11px; }
    main { padding: 14px 16px 16px; }
    .status { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 8px 10px; background: #f3f4f6; border-radius: 8px; color: #555b64; }
    .dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: #a5aab2; }
    .dot.ok { background: #168354; }
    .dot.err { background: #d64545; }
    label { display: block; margin: 13px 0 5px; color: #464b53; font-size: 12px; font-weight: 650; }
    .keyrow { display: grid; grid-template-columns: 1fr 36px; gap: 6px; }
    input, select, button { font: inherit; }
    input[type="password"], input[type="text"], select { width: 100%; min-width: 0; height: 36px; padding: 7px 9px; border: 1px solid #cfd3d9; border-radius: 7px; background: #fff; color: #17181b; outline: none; }
    input:focus, select:focus { border-color: #4c67e8; box-shadow: 0 0 0 2px rgba(76,103,232,.12); }
    button { height: 36px; padding: 0 12px; border: 1px solid #cfd3d9; border-radius: 7px; background: #fff; color: #292d33; font-weight: 650; cursor: pointer; }
    button:hover { background: #f5f6f7; }
    button.primary { width: 100%; margin-top: 10px; border-color: #17181b; background: #17181b; color: #fff; }
    button.primary:hover { background: #2a2c31; }
    button:disabled { opacity: .55; cursor: default; }
    .iconbtn { width: 36px; padding: 0; font-size: 11px; }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #eceef1; }
    .toggle label { margin: 0; }
    .toggle input { width: 17px; height: 17px; accent-color: #17181b; }
    .hint { margin-top: 10px; color: #858a93; font-size: 11px; }
    .hint a { color: #4c67e8; text-decoration: none; }
    .version { margin-top: 12px; color: #b0b4bb; font-size: 10px; text-align: right; }
    .auth { margin-top: 10px; padding: 10px; border: 1px solid #e5e7eb; border-radius: 9px; background: #fff; }
    .account { display: none; align-items: center; gap: 9px; }
    .account.show { display: flex; }
    .account img { width: 30px; height: 30px; border-radius: 50%; background: #eef0f3; }
    .account-copy { min-width: 0; flex: 1; }
    .account-copy b, .account-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-copy span { color: #747982; font-size: 10px; }
    .owner { color: #c94c45; font-size: 9px; font-weight: 800; }
    .logout { height: 28px; padding: 0 8px; font-size: 10px; }
    .google { width: 100%; margin-top: 0; border-color: #d7dbe0; background: #fff; }
    details { margin-top: 12px; padding-top: 12px; border-top: 1px solid #eceef1; }
    summary { color: #555b64; cursor: pointer; font-size: 11px; font-weight: 700; }
    .inline-check { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-weight: 600; }
    .inline-check input { width: 16px; height: 16px; margin: 0; accent-color: #17181b; }
    .viral-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .viral-grid label { margin-top: 9px; }
    .viral-note { margin-top: 8px; color: #858a93; font-size: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="mark"><img src="../assets/icons/icon-48.png" alt="COCO"></div>
    <div class="title"><b>COCO Creator Intel</b><span>你的达人情报助手</span></div>
  </header>
  <main>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">读取设置中...</span></div>

    <div class="auth">
      <button class="google" id="googleLogin" type="button">使用 Google 账号登录</button>
      <div class="account" id="account">
        <img id="accountPicture" alt="">
        <div class="account-copy"><b id="accountName"></b><span id="accountEmail"></span><span class="owner" id="ownerBadge"></span></div>
        <button class="logout" id="logoutBtn" type="button">退出</button>
      </div>
    </div>

    <details>
      <summary>粉丝画像（TikHub，可选）</summary>
      <label for="apiKey">TikHub API Key（用于粉丝画像）</label>
      <div class="keyrow">
        <input id="apiKey" type="password" autocomplete="off" placeholder="可选：Bearer Token">
        <button class="iconbtn" id="showKey" type="button" title="显示或隐藏 API Key">显示</button>
      </div>

      <label for="cacheHours">粉丝画像缓存时间</label>
      <select id="cacheHours">
        <option value="1">1 小时</option>
        <option value="6">6 小时</option>
        <option value="24">24 小时</option>
        <option value="72">3 天</option>
        <option value="168">7 天</option>
      </select>
    </details>

    <details>
      <summary>X 流速雷达（页面本地计算）</summary>
      <label class="inline-check" for="xViralEnabled"><input id="xViralEnabled" type="checkbox">显示帖子流速徽章</label>
      <label class="inline-check" for="xLeaderboardEnabled"><input id="xLeaderboardEnabled" type="checkbox">显示本次浏览热帖榜</label>
      <div class="viral-grid">
        <div><label for="xTrendingPerHour">热门阈值 / 小时</label><input id="xTrendingPerHour" type="text" inputmode="numeric"></div>
        <div><label for="xViralPerHour">爆发阈值 / 小时</label><input id="xViralPerHour" type="text" inputmode="numeric"></div>
      </div>
      <label for="xTopN">热帖榜数量</label>
      <select id="xTopN"><option value="5">5</option><option value="10">10</option><option value="15">15</option><option value="20">20</option></select>
      <div class="viral-note">流速 = 当前累计浏览量 ÷ 发布至今小时数。只读取 X 页面已经加载的公开帖子数据，不调用 X API，也不上传帖子内容。</div>
    </details>

    <div class="toggle">
      <label for="enabled">在达人主页显示面板</label>
      <input id="enabled" type="checkbox">
    </div>

    <button class="primary" id="saveBtn" type="button">保存设置</button>
    <div class="hint">任何 Google 账号都可登录查看公开达人资料。报价与过往合作仅向已验证的所有者账号开放。</div>
    <div class="hint"><a href="https://app.tikhub.io" target="_blank" rel="noreferrer">打开 TikHub 控制台</a></div>
    <div class="version" id="version"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
